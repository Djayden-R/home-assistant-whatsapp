name: Build WAHA app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "waha/**"
      - "scripts/smoke_waha_app.mjs"
      - ".github/workflows/build-waha.yml"
  push:
    branches:
      - main
    paths:
      - "waha/**"
      - "scripts/smoke_waha_app.mjs"
      - ".github/workflows/build-waha.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read app version
        id: version
        shell: bash
        run: |
          version="$(awk -F '"' '/^version:/ { print $2; exit }' waha/config.yaml)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/setup-qemu-action@v3

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build local verification image
        uses: docker/build-push-action@v6
        with:
          context: ./waha
          platforms: linux/amd64
          load: true
          push: false
          tags: ha-waha-smoke:${{ steps.version.outputs.version }}
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Smoke-test isolated unlinked session
        run: node scripts/smoke_waha_app.mjs "ha-waha-smoke:${{ steps.version.outputs.version }}"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified WAHA app image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./waha
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/djayden-r/ha-waha:${{ steps.version.outputs.version }}
            ghcr.io/djayden-r/ha-waha:latest
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=WAHA for Home Assistant
            io.hass.description=Self-hosted WhatsApp API with a Home Assistant sidebar control panel
            io.hass.url=https://github.com/Djayden-R/home-assistant-whatsapp
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
