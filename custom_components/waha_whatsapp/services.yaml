send_message:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp
    to:
      example: "+39 333 123 4567"
      required: true
      selector:
        text:
          type: tel
    title:
      example: Garage warning
      selector:
        text:
    message:
      example: The garage door has been open for 10 minutes.
      required: true
      selector:
        text:
          multiline: true
    link_preview:
      default: true
      selector:
        boolean:

send_poll:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          filter:
            domain: notify
            integration: waha_whatsapp
    title:
      example: Sleep mode
      selector:
        text:
    message:
      example: Cancel Sleep mode before it starts?
      required: true
      selector:
        text:
          multiline: true
    actions:
      example:
        - action: CANCEL_SLEEP_MODE
          title: Cancel
      required: true
      selector:
        object:
    settle_seconds:
      default: 5
      selector:
        number:
          min: 0
          max: 30
          step: 1
          mode: slider
          unit_of_measurement: s
    no_action_title:
      default: No action
      example: Keep scheduled
      selector:
        text:
    content_redacted:
      default: false
      selector:
        boolean:

send_poll_to_conversation:
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    conversation_id:
      required: true
      selector:
        text:
    client_request_id:
      required: true
      selector:
        text:
    message:
      required: true
      selector:
        text:
          multiline: true
    title:
      selector:
        text:
    actions:
      required: true
      selector:
        object:
    settle_seconds:
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 1
    content_redacted:
      default: false
      selector:
        boolean:

send_to_conversation:
  fields:
    conversation_id:
      required: true
      example: direct_opaque_456
      selector:
        text:
    message:
      required: true
      example: The house is in Home mode.
      selector:
        text:
          multiline: true
    reply_to_message_id:
      example: msg_opaque_abc
      selector:
        text:
    client_request_id:
      example: request_example
      selector:
        text:
    origin:
      selector:
        select:
          options:
            - automation
            - application
            - human
            - unknown
    content_redacted:
      default: false
      selector:
        boolean:

get_channel_capabilities:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp

get_group_membership:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp
    membership_id:
      example: membership_opaque_abc
      selector:
        text:

register_command:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp
    name:
      required: true
      example: status
      selector:
        text:
    aliases:
      example:
        - house
      selector:
        object:
    allowed_contacts:
      example:
        - notify.waha_seba
      selector:
        entity:
          filter:
            domain: notify
            integration: waha_whatsapp
          multiple: true
    allow_current_guests:
      default: false
      selector:
        boolean:

unregister_command:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp
    name:
      required: true
      example: status
      selector:
        text:

list_commands:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp

get_media:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp
    conversation_id:
      required: true
      selector:
        text:
    message_id:
      required: true
      selector:
        text:
    attachment_id:
      required: true
      selector:
        text:
    max_bytes:
      selector:
        number:
          min: 1
          max: 26214400
          mode: box

send_media_to_conversation:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp
    conversation_id:
      required: true
      selector:
        text:
    upload_id:
      required: true
      selector:
        text:
    kind:
      required: true
      selector:
        select:
          options:
            - image
            - file
            - audio
    as_voice_note:
      default: false
      selector:
        boolean:
    client_request_id:
      required: true
      selector:
        text:
    caption:
      selector:
        text:
    reply_to_message_id:
      selector:
        text:
    origin:
      selector:
        select:
          options:
            - automation
            - application
            - human
            - unknown
    content_redacted:
      default: false
      selector:
        boolean:

get_poll_selections:
  name: Replay application poll selections
  description: Return authenticated application selections for a current direct contact, retained for up to seven days and 2048 selections per connection. Does not replay ordinary chat or household automation actions.
  fields:
    config_entry_id:
      required: true
      selector:
        text:
    conversation_id:
      required: true
      selector:
        text:
    after_sequence:
      default: 0
      selector:
        number:
          min: 0
          mode: box
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 100
          mode: box

mark_conversation_read:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp
    conversation_id:
      required: true
      example: direct_example
      selector:
        text:
    message_id:
      required: true
      example: msg_incoming_example
      selector:
        text:

set_conversation_typing:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: waha_whatsapp
    conversation_id:
      required: true
      example: direct_example
      selector:
        text:
    activity_id:
      required: true
      example: activity_example_01
      selector:
        text:
    state:
      required: true
      selector:
        select:
          options:
            - typing
            - paused
    ttl_seconds:
      selector:
        number:
          min: 3
          max: 15
          step: 1
          mode: box
          unit_of_measurement: s
